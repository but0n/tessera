[workspace]
resolver = "3"
members = [
    "crates/tessera-domain",
    "crates/tessera-voronoi",
    "crates/tessera-infra",
    "crates/tessera-app",
    "crates/tessera-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
tessera-domain = { path = "crates/tessera-domain" }
tessera-voronoi = { path = "crates/tessera-voronoi" }
tessera-infra = { path = "crates/tessera-infra" }
tessera-app = { path = "crates/tessera-app" }

wgpu = "30"
winit = "0.30"
glyphon = "0.12"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1.11"
crossbeam-channel = "0.5"
parking_lot = "0.12"
libc = "0.2"
trash = "5"
rfd = "0.18"
png = "0.18"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
